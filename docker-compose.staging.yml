services:
  db:
    image: mysql:8.0
    container_name: fabric_staging_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_NAME_STAGING:-fabric_store_staging}
      MYSQL_USER: ${DB_USER:-fabric_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3308:3306"
    volumes:
      - db_data_staging:/var/lib/mysql

  redis:
    image: redis:7.2-alpine
    container_name: fabric_staging_redis
    restart: always
    ports:
      - "6380:6379"

  backend:
    image: ${DOCKERHUB_USERNAME:-yaakov94}/bingo-backend:staging
    container_name: fabric_staging_backend
    restart: always
    ports:
      - "8001:8000"
    environment:
      - TZ=Asia/Jerusalem
      - FRONTEND_URL=https://bingo-staging.duckdns.org
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-fabric_user}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - DB_NAME=${DB_NAME_STAGING:-fabric_store_staging}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-testsecretkey}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - STORAGE_ENV=${STORAGE_ENV:-dev}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - WISTIA_API_TOKEN=${WISTIA_API_TOKEN}
    volumes:
      - backend_uploads_staging:/app/uploads
      - ./credentials.json:/app/credentials.json
      - ./token.json:/app/token.json
      - ./backups:/app/backups
    depends_on:
      - db
      - redis

  db_backup:
    image: ${DOCKERHUB_USERNAME:-yaakov94}/bingo-backend:staging
    container_name: fabric_staging_backup
    restart: always
    environment:
      - TZ=Asia/Jerusalem
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-fabric_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - DB_NAME=${DB_NAME_STAGING:-fabric_store_staging}
    volumes:
      - ./credentials.json:/app/credentials.json
      - ./token.json:/app/token.json
      - ./backups:/app/backups
    depends_on:
      - db
    command: python run_backup_scheduler.py

  frontend:
    image: ${DOCKERHUB_USERNAME:-yaakov94}/bingo-frontend:staging
    container_name: fabric_staging_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VITE_API_URL=https://bingo-staging.duckdns.org
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - backend_uploads_staging:/app/uploads
    depends_on:
      - backend

volumes:
  db_data_staging:
  backend_uploads_staging:
