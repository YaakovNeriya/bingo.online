# 0. Detect Social Media Bots for OG Tags
map $http_user_agent $is_social_bot {
    default 0;
    "~*WhatsApp" 1;
    "~*facebookexternalhit" 1;
    "~*Twitterbot" 1;
    "~*LinkedInBot" 1;
    "~*Pinterest" 1;
    "~*TelegramBot" 1;
}

# 1. Global limit: 10MB memory zone, 20 requests per second
limit_req_zone $binary_remote_addr zone=global_limit:10m rate=20r/s;

# 2. Sensitive limit: 1 request per second
limit_req_zone $binary_remote_addr zone=sensitive_limit:10m rate=1r/s;

server {
    listen 80;
    access_log off;
    error_log /var/log/nginx/error.log warn;
    resolver 127.0.0.11 valid=30s;

    # GZIP Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Serve the React application
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Aggressively cache Vite static assets (JS/CSS)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Intercept Product sharing for Bots
    location /product/ {
        if ($is_social_bot) {
            # Rewrite /product/123 to /api/v1/share/product/123
            # 'last' means it will re-evaluate the new URI against the location blocks, hitting /api/ below
            rewrite ^/product/(.*)$ /api/v1/share/product/$1 last;
        }
        # For humans, serve the React app
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Serve static uploads directly from disk for maximum performance
    location /uploads/ {
        alias /app/uploads/;
        expires max;
        access_log off;
        add_header Cache-Control "public";
    }

    # Proxy API requests to the FastAPI backend with Rate Limiting
    location /api/ {
        # Allow burst of 10 without delay
        limit_req zone=global_limit burst=10 nodelay;

        set $backend_api "http://backend:8000";
        proxy_pass $backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stricter protection for Login path
    location /api/v1/users/login {
        limit_req zone=sensitive_limit burst=3 nodelay;

        set $backend_login "http://backend:8000";
        proxy_pass $backend_login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Swagger Docs
    location /docs {
        set $backend_docs "http://backend:8000";
        proxy_pass $backend_docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        set $backend_openapi "http://backend:8000";
        proxy_pass $backend_openapi;
        proxy_set_header Host $host;
    }
}

# Beszel Monitoring Dashboard Reverse Proxy
server {
    listen 80;
    server_name monitor.bingo.online;
    resolver 127.0.0.11 valid=30s;

    location / {
        set $beszel_hub "http://beszel:8090";
        proxy_pass $beszel_hub;
        
        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket Support (Required for Live Graphs)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
