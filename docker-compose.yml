version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: fabric_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_NAME:-fabric_store}
      MYSQL_USER: ${DB_USER:-fabric_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s

  redis:
    image: redis:7.2-alpine
    container_name: fabric_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s

  backend:
    build:
      context: ./backend
    container_name: fabric_backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Jerusalem
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-fabric_user}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - DB_NAME=${DB_NAME:-fabric_store}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-testsecretkey}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-20160}
      - STORAGE_ENV=${STORAGE_ENV:-dev}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - WISTIA_API_TOKEN=${WISTIA_API_TOKEN}
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
      - ./credentials.json:/app/credentials.json
      - ./token.json:/app/token.json
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 5s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db_backup:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: fabric_backup
    restart: always
    environment:
      - TZ=Asia/Jerusalem
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-fabric_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - DB_NAME=${DB_NAME:-fabric_store}
    volumes:
      - ./backend:/app
      - ./credentials.json:/app/credentials.json
      - ./token.json:/app/token.json
    depends_on:
      - db
    command: python run_backup_scheduler.py

  frontend:
    build:
      context: ./frontend
    container_name: fabric_frontend
    restart: always
    # WARNING: Using build & preview locally means you lose hot-reloading! You must restart the container to see code changes.
    # docker restart fabric_frontend
    # docker logs -f fabric_frontend
    # docker compose up -d frontend

    # To run in production preview mode, use:
    # command: sh -c "npm install && npm run build && npm run preview -- --host 0.0.0.0 --port 5173"
    # To run in development mode (with HMR / hot-reloading), use:
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - TZ=Asia/Jerusalem
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      - backend

volumes:
  db_data:
  backend_uploads:
