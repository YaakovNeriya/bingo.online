name: Build Staging

on:
  push:
    branches: [ "staging" ]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - '.github/workflows/test.yml'
      - 'backend/tests/**'
      - 'backend/pytest.ini'
      - 'backend/requirements-dev.txt'
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/test.yml
    secrets: inherit

  build_staging:
    name: Build Staging
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          # platforms: linux/amd64,linux/arm64
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bingo-backend:staging
            ${{ secrets.DOCKERHUB_USERNAME }}/bingo-backend:staging-build-${{ github.run_number }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          # platforms: linux/amd64,linux/arm64
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bingo-frontend:staging
            ${{ secrets.DOCKERHUB_USERNAME }}/bingo-frontend:staging-build-${{ github.run_number }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL_STAGING }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Copy docker-compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_VPS_HOST }}
          username: ${{ secrets.STAGING_VPS_USERNAME }}
          key: ${{ secrets.STAGING_VPS_SSH_KEY }}
          source: "docker-compose.staging.yml"
          target: "bingo.online.staging"

      - name: Deploy to VPS and Set Secrets
        uses: appleboy/ssh-action@v1.0.3
        # This step will run to deploy to VPS
        with:
          host: ${{ secrets.STAGING_VPS_HOST }}
          username: ${{ secrets.STAGING_VPS_USERNAME }}
          key: ${{ secrets.STAGING_VPS_SSH_KEY }}
          script: |
            # Set PATH so docker command is found in non-interactive shell
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/snap/bin

            # Ensure Docker is installed (automatically installs if missing)
            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com -o get-docker.sh
              sudo sh get-docker.sh
              sudo usermod -aG docker $USER
            fi

            # Set default path if not provided
            DEPLOY_PATH="${{ secrets.STAGING_VPS_DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="$HOME/bingo.online.staging"
            fi
            
            # Create directory if it doesn't exist
            mkdir -p $DEPLOY_PATH
            cd $DEPLOY_PATH
            
            # Plant the .env file with secrets from GitHub
            cat <<EOF > .env
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            WISTIA_API_TOKEN=${{ secrets.WISTIA_API_TOKEN }}
            EOF
            
            # Plant the Google Drive OAuth JSON files (Important: remove any dummy directories docker might have created)
            sudo rm -rf credentials.json token.json
            cat <<'EOF' > credentials.json
            ${{ secrets.DRIVE_CREDENTIALS_JSON }}
            EOF
            cat <<'EOF' > token.json
            ${{ secrets.DRIVE_TOKEN_JSON }}
            EOF

            # Login to Docker Hub in case the repository is private
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Pull the latest images built by this action
            sudo docker compose -f docker-compose.staging.yml pull
            
            # Option 2: Smart Conditional Backup
            echo "Checking if database migration is required..."
            # Check if running alembic upgrade head generates any SQL
            if sudo docker compose -f docker-compose.staging.yml run --rm backend alembic upgrade head --sql | grep -q "UPDATE alembic_version"; then
              echo "Pending database changes detected. Running Google Drive backup before migration..."
              sudo docker compose -f docker-compose.staging.yml exec -T backend python backup_to_drive.py || echo "Warning: Backup failed!"
            else
              echo "No pending database changes. Skipping backup."
            fi
            
            # Option 1: Safe Migration (Controlled Downtime)
            # Stop the backend to prevent race conditions during migration
            sudo docker compose -f docker-compose.staging.yml stop backend
            
            # Run Alembic migrations on a temporary container
            echo "Running Alembic migrations..."
            if ! sudo docker compose -f docker-compose.staging.yml run --rm backend alembic upgrade head; then
              echo "❌ Migration failed! Halting pipeline to prevent deployment of broken state."
              exit 1
            fi
            
            # Restart all services with the new code
            sudo docker compose -f docker-compose.staging.yml up -d
            
            # Wait a few seconds for FastAPI to start
            sleep 5
            
            # Option 5: Health Check (Halt pipeline on failure)
            echo "Running health check on http://localhost:8001/api/v1/health..."
            if ! curl -s -f http://localhost:8001/api/v1/health > /dev/null; then
              echo "ERROR: Health check failed! The backend API is down. Check logs!"
              exit 1
            fi
            echo "Health check passed! Deployment successful."
