name: Build Production

on:
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/test.yml
    secrets: inherit

  build_production:
    name: Build Production
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          # platforms: linux/amd64,linux/arm64
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bingo-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bingo-backend:prod-build-${{ github.run_number }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          # platforms: linux/amd64,linux/arm64
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bingo-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bingo-frontend:prod-build-${{ github.run_number }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL_PROD }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Copy docker-compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "bingo.online"

      - name: Deploy to VPS and Set Secrets
        uses: appleboy/ssh-action@v1.0.3
        # This step will run to deploy to VPS
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Set PATH so docker command is found in non-interactive shell
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/snap/bin

            # Ensure Docker is installed (automatically installs if missing)
            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com -o get-docker.sh
              sudo sh get-docker.sh
              sudo usermod -aG docker $USER
            fi

            # Set default path if not provided
            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="$HOME/bingo.online"
            fi
            
            # Create directory if it doesn't exist
            mkdir -p $DEPLOY_PATH
            cd $DEPLOY_PATH

            # Determine production domain (defaults to bingo.online)
            PROD_DOMAIN="${{ secrets.PROD_DOMAIN }}"
            if [ -z "$PROD_DOMAIN" ]; then
              PROD_DOMAIN="bingo.online"
            fi

            # Ensure Certbot webroot folder exists
            sudo mkdir -p /var/www/certbot

            # Auto-issue SSL certificate via Certbot if missing on a new production server
            if [ ! -f /etc/letsencrypt/live/${PROD_DOMAIN}/fullchain.pem ]; then
              echo "🔑 New production server detected! Installing Certbot and issuing SSL certificate..."
              if ! command -v certbot &> /dev/null; then
                sudo apt-get update && sudo apt-get install -y certbot
              fi
              # Stop existing containers if any to free up port 80 for standalone verification
              sudo docker compose -f docker-compose.prod.yml down 2>/dev/null || true
              
              sudo certbot certonly --standalone \
                -d ${PROD_DOMAIN} \
                --non-interactive \
                --agree-tos \
                --register-unsafely-without-email || { echo "❌ ERROR: Certbot initial setup failed!"; exit 1; }
            fi

            # Ensure /etc/letsencrypt/live/active points to the production certificate directory
            if [ -d /etc/letsencrypt/live/${PROD_DOMAIN} ]; then
              sudo ln -sfn /etc/letsencrypt/live/${PROD_DOMAIN} /etc/letsencrypt/live/active
            fi

            # Setup cron job to check and renew certificate automatically every 2 days at 03:00 AM
            echo "0 3 */2 * * root certbot renew --webroot -w /var/www/certbot --deploy-hook 'docker exec fabric_frontend nginx -s reload' --quiet" | sudo tee /etc/cron.d/certbot-renew-prod > /dev/null
            sudo chmod 644 /etc/cron.d/certbot-renew-prod
            
            # Plant the .env file with secrets from GitHub
            cat <<EOF > .env
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            WISTIA_API_TOKEN=${{ secrets.WISTIA_API_TOKEN }}
            EOF
            
            # Plant the Google Drive OAuth JSON files (Important: remove any dummy directories docker might have created)
            sudo rm -rf credentials.json token.json
            cat <<'EOF' > credentials.json
            ${{ secrets.DRIVE_CREDENTIALS_JSON }}
            EOF
            cat <<'EOF' > token.json
            ${{ secrets.DRIVE_TOKEN_JSON }}
            EOF

            # Login to Docker Hub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | sudo docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Step A: Backup current working images by tagging them as "previous"
            echo "Tagging current working images as 'previous' for potential rollback..."
            OLD_BACKEND=$(sudo docker images -q ${{ secrets.DOCKERHUB_USERNAME }}/bingo-backend:latest)
            OLD_FRONTEND=$(sudo docker images -q ${{ secrets.DOCKERHUB_USERNAME }}/bingo-frontend:latest)
            if [ ! -z "$OLD_BACKEND" ]; then
              sudo docker tag $OLD_BACKEND ${{ secrets.DOCKERHUB_USERNAME }}/bingo-backend:previous
            fi
            if [ ! -z "$OLD_FRONTEND" ]; then
              sudo docker tag $OLD_FRONTEND ${{ secrets.DOCKERHUB_USERNAME }}/bingo-frontend:previous
            fi

            # Step B: Pull the new images
            sudo docker compose -f docker-compose.prod.yml pull
            
            # Step B.5: Smart Conditional Backup
            echo "Checking if database migration is required..."
            if sudo docker compose -f docker-compose.prod.yml run --rm backend alembic upgrade head --sql | grep -q "UPDATE alembic_version"; then
              echo "Pending database changes detected. Running Google Drive backup before migration..."
              if ! sudo docker compose -f docker-compose.prod.yml exec -T backend python backup_to_drive.py; then
                echo "Container is down (exec failed). Falling back to temporary container (run --rm)..."
                sudo docker compose -f docker-compose.prod.yml run --rm backend python backup_to_drive.py || echo "Warning: Backup failed!"
              fi
            else
              echo "No pending database changes. Skipping backup."
            fi
            
            # Step C: Safe Migration (Controlled Downtime)
            sudo docker compose -f docker-compose.prod.yml stop backend
            
            echo "Running Alembic migrations..."
            if ! sudo docker compose -f docker-compose.prod.yml run --rm backend alembic upgrade head; then
                echo "❌ Migration failed! Initiating Automatic Rollback..."
                # Since migration failed, DB is unchanged. Just restore old images.
                if [ ! -z "$OLD_BACKEND" ]; then
                  sudo docker tag ${{ secrets.DOCKERHUB_USERNAME }}/bingo-backend:previous ${{ secrets.DOCKERHUB_USERNAME }}/bingo-backend:latest
                  sudo docker tag ${{ secrets.DOCKERHUB_USERNAME }}/bingo-frontend:previous ${{ secrets.DOCKERHUB_USERNAME }}/bingo-frontend:latest
                fi
                sudo docker compose -f docker-compose.prod.yml up -d
                echo "Rollback complete. Server restored to previous state."
                exit 1
            fi
            
            # Step D: Start new code
            sudo docker compose -f docker-compose.prod.yml up -d
            
            # Wait a few seconds for FastAPI to start
            sleep 3
            
            # Step E: Health Check & Automatic Rollback
            echo "Running health check on http://localhost:8001/api/v1/health..."
            if ! curl -s -f --retry 5 --retry-delay 3 http://localhost:8001/api/v1/health > /dev/null; then
              echo "❌ Health check failed! Initiating Automatic Rollback..."
              
              # 1. Stop broken code
              sudo docker compose -f docker-compose.prod.yml stop backend
              
              # 2. Downgrade Database (since migration succeeded but code is broken)
              sudo docker compose -f docker-compose.prod.yml run --rm backend alembic downgrade -1
              
              # 3. Restore old images
              if [ ! -z "$OLD_BACKEND" ]; then
                sudo docker tag ${{ secrets.DOCKERHUB_USERNAME }}/bingo-backend:previous ${{ secrets.DOCKERHUB_USERNAME }}/bingo-backend:latest
                sudo docker tag ${{ secrets.DOCKERHUB_USERNAME }}/bingo-frontend:previous ${{ secrets.DOCKERHUB_USERNAME }}/bingo-frontend:latest
              fi
              
              # 4. Restart server with old working code
              sudo docker compose -f docker-compose.prod.yml up -d
              echo "Rollback complete. Server restored to previous state."
              exit 1
            fi
            
            echo "✅ Health check passed! Deployment successful."
            
            # Clean up old unused images to save disk space
            echo "Cleaning up old Docker images..."
            sudo docker image prune -f || true
